add_newline = true
palette = "tokyonight"

format = """
${custom.top_insert}${custom.top_error}${custom.top_normal}$directory$git_branch
$character"""

[palettes.tokyonight]
light_blue_white = "#c0caf5"
blue = "#7aa2f7"
purple = "#bb9af7"
red = "#f7768e"

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold light_blue_white"
format = "[ ❯ ](bold light_blue_white)[$symbol$branch]($style) "

[character]
success_symbol = "[╰─](bold light_blue_white)"
error_symbol = "[╰─](bold light_blue_white)"
vimcmd_symbol = "[╰─](bold blue)"
# success_symbol = "[╰─○](bold light_blue_white)"
# error_symbol = "[╰─○](bold red)"
# vimcmd_symbol = "[╰─○](bold blue)"
# success_symbol = "[╰─●](bold light_blue_white)"
# error_symbol = "[╰─●](bold red)"
# vimcmd_symbol = "[╰─●](bold blue)"

# --- Custom Modules for the Top Brace ---
[custom.top_insert]
command = 'echo -n "╭"'
when = 'test "$STARSHIP_KEYMAP" != "vicmd" && test "${STARSHIP_PREV_STATUS:-0}" = "0"'
format = "[$output ](bold light_blue_white)"

[custom.top_normal]
command = 'echo -n "╭"'
when = 'test "$STARSHIP_KEYMAP" = "vicmd"'
format = "[$output ](bold blue)"

[custom.top_error]
command = 'echo -n "╭"'
when = 'test "$STARSHIP_KEYMAP" != "vicmd" && test "${STARSHIP_PREV_STATUS:-0}" != "0"'
format = "[$output ](bold light_blue_white)"
